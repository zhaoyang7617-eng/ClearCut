name: Build Chinese APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'app/src/main/res/values-zh-rCN/**'
      - 'app/src/main/res/xml/locales_config.xml'
      - '.github/workflows/build-zhcn-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Collect APK
        if: success()
        run: |
          mkdir -p out
          find app/build/outputs/apk -type f -name "*.apk" -exec cp {} out/ \;
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ClearCut-v3.81.0-zhCN-debug
          path: out/*.apk
          if-no-files-found: error
